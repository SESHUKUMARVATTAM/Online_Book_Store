<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">

    <title>Book Catalogue</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            border-radius: 10px;
            background-color: transparent;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border: 1px solid black;
        }

        th {
             background-color: transparent;
            color: black;
        }

        a {
            color: darkblue;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: red;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>BOOK CATALOGUE</h1>

        <table>

            <tr>
                <th>Course</th>
                <th>View Books</th>
            </tr>

            <tr>
                <td>CSE</td>
                <td>
                    <a href="Cse.html">View CSE Books</a>
                </td>
            </tr>

            <tr>
                <td>ECE</td>
                <td>
                    <a href="Ece.html">View ECE Books</a>
                </td>
            </tr>

            <tr>
                <td>EEE</td>
                <td>
                    <a href="Eee.html">View EEE Books</a>
                </td>
            </tr>

            <tr>
                <td>CIVIL</td>
                <td>
                    <a href="Civil.html">View CIVIL Books</a>
                </td>
            </tr>

        </table>

    </div>

</body>

</html>
