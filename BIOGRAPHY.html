<!DOCTYPE html>
<html>

<head>

    <title>FICTION Books</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .product {
            background-color: white;
            border: 1px solid #ccc;
            padding: 20px;
            margin: 15px;
            width: 220px;
            display: inline-block;
            vertical-align: top;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
        }

        .book {
            font-size: 70px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            background-color: seagreen;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

    </style>

</head>

<body>

    <h1>BIOGRAPHY Books</h1>

    <div class="product">

        <div class="book">📘</div>

        <h3>Wings of Fire</h3>

        <p>AUTHOR: A.P.J. Abdul Kalam</p>

        <p class="price">₹599</p>

        <button>Add to Cart</button>

    </div>


    <div class="product">

        <div class="book">📗</div>

        <h3>Steve Jobs</h3>

        <p>AUTHOR: Walter Isaacson</p>

        <p class="price">₹799</p>

        <button>Add to Cart</button>

    </div>


    <div class="product">

        <div class="book">📕</div>

        <h3>The Story of My Experiments with Truth</h3>

        <p>AUTHOR: Mahatma Gandhi</p>

        <p class="price">₹899</p>

        <button>Add to Cart</button>

    </div>


    <div class="product">

        <div class="book">📙</div>

        <h3>Long Walk to Freedom</h3>


        <p class="price">₹699</p>

        <button>Add to Cart</button>

    </div>

</body>

</html>
