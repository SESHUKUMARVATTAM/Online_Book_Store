<!DOCTYPE html>
<html>

<head>

    <title>FICTION Books</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .product {
            background-color: white;
            border: 1px solid #ccc;
            padding: 20px;
            margin: 15px;
            width: 220px;
            display: inline-block;
            vertical-align: top;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
        }

        .book {
            font-size: 70px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            background-color: seagreen;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

    </style>

</head>

<body>

    <h1>FICTION Books</h1>

    <div class="product">

        <div class="book">📘</div>

        <h3>The Great Gatsby</h3>

        <p>A classic American novel set in the Jazz Age.</p>

        <p class="price">₹599</p>

        <button>Add to Cart</button>

    </div>


    <div class="product">

        <div class="book">📗</div>

        <h3>the madness world</h3>

        <p>the horrer madam </p>

        <p class="price">₹799</p>

        <button>Add to Cart</button>

    </div>


    <div class="product">

        <div class="book">📕</div>

        <h3>THE GAINT</h3>

        <p>LIFE STORY OF GAINT.</p>

        <p class="price">₹899</p>

        <button>Add to Cart</button>

    </div>


    <div class="product">

        <div class="book">📙</div>

        <h3>The Alchemist</h3>

        <p>AUTHER :Paulo Coelho.</p>

        <p class="price">₹699</p>

        <button>Add to Cart</button>

    </div>

</body>

</html>
