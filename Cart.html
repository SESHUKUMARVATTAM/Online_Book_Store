<!DOCTYPE html>
<html>

<head>

    <title>Cart Page</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        .cart {
            max-width: 800px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: seagreen;
            color: white;
        }

        .total {
            text-align: right;
            color: darkgreen;
        }

    </style>

</head>

<body>

    <div class="cart">

        <h1>SHOPPING CART</h1>

        <table>

            <tr>
                <th>Book Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Amount</th>
            </tr>

            <tr>
                <td>Java 2</td>
                <td>₹599</td>
                <td>2</td>
                <td>₹1198</td>
            </tr>

            <tr>
                <td>XML Bible</td>
                <td>₹699</td>
                <td>1</td>
                <td>₹699</td>
            </tr>

        </table>

        <div class="total">

            <h2>Total Amount: ₹1897</h2>

        </div>

    </div>

</body>

</html>
