<!DOCTYPE html>
<html>

<head>

    <title>Civil Books</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .product {
            background-color: white;
            border: 1px solid #ccc;
            padding: 20px;
            margin: 15px;
            width: 220px;
            display: inline-block;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
        }

        .book {
            font-size: 70px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            background-color: seagreen;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <h1>CIVIL ENGINEERING</h1>

    <div class="product">

        <div class="book">📘</div>

        <h3>Engineering Mechanics</h3>

        <p>Fundamentals of engineering mechanics.</p>

        <p class="price">₹650</p>

        <button>Add to Cart</button>

    </div>


    <div class="product">

        <div class="book">📗</div>

        <h3>Structural Engineering</h3>

        <p>Basics of structural design.</p>

        <p class="price">₹850</p>

        <button>Add to Cart</button>

    </div>


    <div class="product">

        <div class="book">📕</div>

        <h3>Construction Technology</h3>

        <p>Building construction concepts.</p>

        <p class="price">₹750</p>

        <button>Add to Cart</button>

    </div>

</body>

</html>
